spring:
  application:
    name: clinica-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gracia_osorio}
    username: ${DB_USER:gracia}
    password: ${DB_PASSWORD:gracia}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  cors:
    # Orígenes desde los que el frontend puede llamar a la API (separados por coma).
    allowed-origin-patterns: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
